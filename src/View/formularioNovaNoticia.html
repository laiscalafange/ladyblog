<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Notícia</title>
</head>

<body>

    {% if avisos %}
    <h1>{{ avisos }}</h1>
    {% endif %}

    <form action="/admin/salvaNoticia" method="post">
        <label for="titulo">Título da notícia:</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="corpo">Notícia:</label>
        <input type="text" id="corpo" name="corpo" required>

        <button type="submit">Cadastrar</button>
    </form>

    <a href="formularioAtualizaNoticia">Atualizar noticias</a><br>
    <a href="formularioDeletaNoticia">Deletar noticias</a><br>
</body>

</html>
