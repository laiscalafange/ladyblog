<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
</head>
<body>
    <h1>Detalhes do Produto</h1>
    {% if produto %}
        <p>ID: {{ produto.id }}</p>
        <p>Nome: {{ produto.nome }}</p>
        <p>Valor: {{ produto.valor }}</p>
    {% else %}
        <p>Produto não encontrado.</p>
    {% endif %}
</body>
</html>
